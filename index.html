    <script>
      // GitHub Pages subdirectory trailing-slash normalization
      (function () {
        var loc = window.location;
        if (loc.hostname.endsWith('github.io')) {
          var parts = loc.pathname.split('/').filter(Boolean);
          if (parts.length === 1 && !loc.pathname.endsWith('/') && !loc.pathname.includes('.')) {
            loc.replace(loc.protocol + '//' + loc.host + loc.pathname + '/' + loc.search + loc.hash);
          }
        }
      })();
    </script>
